name: TikTok – koble til konto (engangs)

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Konto"
        type: choice
        options: [disrupt, pu]
      step:
        description: "Steg"
        type: choice
        options: [link, exchange]
      code:
        description: "Kun steg 2: lim inn hele adressen du havnet på etter innlogging"
        required: false
        default: ""

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests pynacl
      - name: TikTok auth
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REDIRECT_URI: https://github.com/Kevindisrupting/disrupt-some-notion
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TT_ACCOUNT: ${{ inputs.account }}
          TT_STEP: ${{ inputs.step }}
          TT_CODE: ${{ inputs.code }}
        run: python tiktok_auth.py
