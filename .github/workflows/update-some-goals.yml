name: Update SoMe goals in Notion

on:
  workflow_dispatch:
    inputs:
      close_month:
        description: "Lukk en bestemt måned (YYYY-MM). La stå tomt for vanlig kjøring."
        required: false
        default: ""
      backfill_from:
        description: "Hent historikk fra måned (YYYY-MM), f.eks. 2026-01. Tomt = nei"
        required: false
        default: ""
      write_partial:
        description: "Skriv også rekkevidde, engasjement og visninger for måneden hittil (test)"
        type: boolean
        default: false
      test_meta:
        description: "Test Meta (følgere, netto, rekkevidde) uten å skrive til Notion"
        type: boolean
        default: false
  schedule:
    # Ukentlig: Nåverdi + løpende tall for inneværende måned
    - cron: '30 7 * * 1'
      timezone: 'Europe/Oslo'
    # Den 1. hver måned: sluttall (følgere + rekkevidde) for forrige måned
    - cron: '20 0 1 * *'
      timezone: 'Europe/Oslo'

concurrency:
  group: some-notion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python -m pip install requests pynacl

      - name: Update Notion KPIs
        env:
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IG_TOKEN_DISRUPT: ${{ secrets.IG_TOKEN_DISRUPT }}
          IG_TOKEN_PU: ${{ secrets.IG_TOKEN_PU }}
          IG_TOKEN_HOUSEHOLD: ${{ secrets.IG_TOKEN_HOUSEHOLD }}
          IG_TOKEN_VALSEMOLLEN: ${{ secrets.IG_TOKEN_VALSEMOLLEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_DISRUPT: ${{ secrets.TT_REFRESH_DISRUPT }}
          TT_REFRESH_PU: ${{ secrets.TT_REFRESH_PU }}
          RUN_MODE: ${{ github.event.schedule == '20 0 1 * *' && 'close' || 'auto' }}
          CLOSE_MONTH: ${{ inputs.close_month }}
          TEST_META: ${{ inputs.test_meta }}
          WRITE_PARTIAL: ${{ inputs.write_partial }}
          BACKFILL_FROM: ${{ inputs.backfill_from }}
        run: python update_some_goals.py
